<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Buchhaltungssystem</title>
</head>

<body>

    <h1>Buchhaltungssystem</h1>
    
    <form method="post" action="/add-account">
        <input name="name" placeholder="Konto Name" required>

        <select name="side" id="side" required>
            <option value="">-- Kontoseite wählen --</option>
            <option value="active">Aktivkonto</option>
            <option value="passive">Passivkonto</option>
        </select>

        <select name="type" id="type" required>
            <option value="">-- Kontotyp wählen --</option>
            <option value="current" data-side="active">Umlaufvermögen</option>
            <option value="non-current" data-side="active">Anlagevermögen</option>
            <option value="short-term" data-side="passive">Kurzfristiges Fremdkapital</option>
            <option value="long-term" data-side="passive">Langfristiges Fremdkapital</option>
            <option value="equity" data-side="passive">Eigenkapital</option>
        </select>

        <input name="amount" type="number" step="1" placeholder="Betrag" required>
        
        <select name="flow" required>
            <option value="inflow">Zunahme</option>
            <option value="outflow">Abnahme</option>
        </select>

        <button type="submit">Verbuchen</button>

        <a href="/balance">
            <button type="button">Bilanz anzeigen</button>
        </a>
    </form>

    <script> //make sure to only allow correct account types for account side (active/passive)
        const sideSelect = document.getElementById("side");
        const typeSelect = document.getElementById("type");

        function updateTypeOptions() {
            const side = sideSelect.value;
            for (const option of typeSelect.options) {
                const optionSide = option.getAttribute('data-side');  
                if (optionSide === null) {
                    option.hidden = false;
                } else if (side === "active") {
                    option.hidden = optionSide !== "active";
                } else if (side === "passive") {
                    option.hidden = optionSide !== "passive";
                } else {
                    option.hidden = optionSide !== null;
                }
            }
            if (side) {
                typeSelect.value = "";
            }
        }
        sideSelect.addEventListener("change", updateTypeOptions);
        updateTypeOptions();
    </script>
</body>
</html>
